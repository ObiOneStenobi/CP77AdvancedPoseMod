; AdvancedPoseMod configuration
; This file is re-read every time Photo Mode is opened.

[Probe]
; Phase 0 research probe: finds how the animation system maps to V's Photo Mode puppet.
Enabled=1
; Maximum number of animation samples inspected per Photo Mode session.
ScanBudget=20000
; Write the skeleton (bone names, parents, reference pose) to probe\rig_*.txt
DumpRig=1

[Test]
; Proof of concept: rotate one bone of V while Photo Mode is active.
Enabled=1
; Bone name as it appears in probe\rig_*.txt (e.g. Head, Neck, LeftArm, RightForeArm, Spine2)
Bone=Head
; Rotation in degrees around the bone's local axes (applied Z * Y * X).
RotX=0
RotY=0
RotZ=45

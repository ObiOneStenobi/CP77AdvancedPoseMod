; AdvancedPoseMod configuration
; Read when the game starts and again every time Photo Mode is opened.

[Probe]
; Research probe. It only runs if the built-in animation mapping stops working (e.g. after a game update).
Enabled=1
; Maximum number of animation samples analysed per Photo Mode session.
ScanBudget=4096
; Write the skeletons (bone names, parents, reference pose) to probe\rig_*.txt
DumpRig=0

[Compatibility]
; After a game update the mod stays off until it is updated (the game itself still starts). 1 = try it anyway on an
; unknown game version: it may work, or crash the game if the update moved what the mod reads. Read at game start.
AllowUnknownGameVersion=0

[Debug]
; Detailed diagnostics in red4ext\logs\advancedposemod-*.log (for bug reports).
Log=0
